<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" font-family="ui-monospace, Consolas, 'Courier New', monospace"><title>Qué hace un guardia ante una escritura</title><desc>Secuencia de un guardia: ante una escritura fuera del proyecto, sobre un archivo protegido o con un secreto, el hook consulta la configuración, bloquea y explica sin interrumpir el trabajo, registra el bloqueo y el usuario decide al volver si autoriza esa ruta.</desc><rect width="760" height="456" fill="#0B2540"/><text x="30" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Qué hace un guardia ante una escritura</text><path d="M117.5 92 V448" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="42.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="117.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claude</text><path d="M292.5 92 V448" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="217.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="292.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Guardia (hook)</text><path d="M467.5 92 V448" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="392.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="467.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Configuración</text><path d="M642.5 92 V448" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="567.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="642.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usuario</text><text x="205" y="116" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">escritura riesgosa</text><path d="M117.5 122 H292.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="292.5,122 283.5,117 283.5,127" fill="#5BC0EB"/><text x="380" y="152" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">¿está autorizada?</text><path d="M292.5 158 H467.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,158 458.5,153 458.5,163" fill="#5BC0EB"/><text x="380" y="188" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">no</text><path d="M467.5 194 H292.5" stroke="#5BC0EB" stroke-width="2" stroke-dasharray="6 5"/><polygon points="292.5,194 301.5,189 301.5,199" fill="#5BC0EB"/><path d="M30 218 H730" stroke="#5BC0EB" stroke-opacity="0.6" stroke-dasharray="3 5"/><text x="36" y="234" font-size="12" font-weight="700" fill="#5BC0EB" text-anchor="start">modo denegar (el predeterminado, sin interrumpir)</text><text x="205" y="258" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">bloquea y explica</text><path d="M292.5 264 H117.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="117.5,264 126.5,259 126.5,269" fill="#5BC0EB"/><text x="380" y="294" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">registra el bloqueo</text><path d="M292.5 300 H467.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,300 458.5,295 458.5,305" fill="#5BC0EB"/><path d="M30 324 H730" stroke="#5BC0EB" stroke-opacity="0.6" stroke-dasharray="3 5"/><text x="36" y="340" font-size="12" font-weight="700" fill="#5BC0EB" text-anchor="start">al volver el usuario</text><text x="467.5" y="364" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">informa bloqueos</text><path d="M292.5 370 H642.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="642.5,370 633.5,365 633.5,375" fill="#5BC0EB"/><text x="555" y="400" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">/permitir ruta</text><path d="M642.5 406 H467.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,406 476.5,401 476.5,411" fill="#5BC0EB"/></svg>
