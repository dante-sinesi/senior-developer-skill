<svg xmlns="http://www.w3.org/2000/svg" width="760" height="608" viewBox="0 0 760 608" role="img" font-family="ui-monospace, Consolas, 'Courier New', monospace"><title>Adoptar un proyecto existente</title><desc>Secuencia de adopción: el usuario pide /adoptar-proyecto, Claude muestra un plan y espera aprobación, los scripts generan documentación provisoria con evidencia, y solo lo que el usuario confirma pasa a ser regla de negocio con sus tests.</desc><rect width="760" height="608" fill="#0B2540"/><text x="30" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Adoptar un proyecto existente</text><path d="M117.5 92 V600" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="42.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="117.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usuario</text><path d="M292.5 92 V600" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="217.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="292.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claude</text><path d="M467.5 92 V600" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="392.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="467.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Scripts</text><path d="M642.5 92 V600" stroke="#5BC0EB" stroke-opacity="0.45" stroke-dasharray="4 6"/><rect x="567.5" y="58" width="150" height="34" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="642.5" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">docs/</text><text x="205" y="116" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">/adoptar-proyecto</text><path d="M117.5 122 H292.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="292.5,122 283.5,117 283.5,127" fill="#5BC0EB"/><text x="380" y="152" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">detectar estado</text><path d="M292.5 158 H467.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,158 458.5,153 458.5,163" fill="#5BC0EB"/><text x="380" y="188" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">plan a crear</text><path d="M467.5 194 H292.5" stroke="#5BC0EB" stroke-width="2" stroke-dasharray="6 5"/><polygon points="292.5,194 301.5,189 301.5,199" fill="#5BC0EB"/><text x="205" y="224" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">muestra el plan</text><path d="M292.5 230 H117.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="117.5,230 126.5,225 126.5,235" fill="#5BC0EB"/><text x="205" y="260" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">aprueba</text><path d="M117.5 266 H292.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="292.5,266 283.5,261 283.5,271" fill="#5BC0EB"/><text x="380" y="296" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">documentar proyecto</text><path d="M292.5 302 H467.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,302 458.5,297 458.5,307" fill="#5BC0EB"/><text x="555" y="316" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">escribe docs</text><text x="555" y="332" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">provisorios</text><path d="M467.5 338 H642.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="642.5,338 633.5,333 633.5,343" fill="#5BC0EB"/><rect x="127.5" y="376" width="330" height="46" fill="#5BC0EB" fill-opacity="0.1" stroke="#5BC0EB" stroke-opacity="0.7"/><text x="292.5" y="393" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">Reglas de negocio candidatas: nada se</text><text x="292.5" y="411" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">da por cierto</text><text x="205" y="448" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">consulta con reglas</text><text x="205" y="464" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">por confirmar</text><path d="M292.5 470 H117.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="117.5,470 126.5,465 126.5,475" fill="#5BC0EB"/><text x="205" y="516" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">confirma o corrige</text><path d="M117.5 522 H292.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="292.5,522 283.5,517 283.5,527" fill="#5BC0EB"/><text x="467.5" y="552" font-size="13" font-weight="400" fill="#C9E1F4" text-anchor="middle">pasa lo confirmado y arma sus tests</text><path d="M292.5 558 H642.5" stroke="#5BC0EB" stroke-width="2"/><polygon points="642.5,558 633.5,553 633.5,563" fill="#5BC0EB"/></svg>
