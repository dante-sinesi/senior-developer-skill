name: Pruebas

# Pensado para gastar pocos minutos de Actions (Windows cuenta doble): un solo trabajo en cada Pull Request y sin repetir la corrida al fusionar.
on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"  # los lunes: acá se mira además la compatibilidad con Python 3.10
  workflow_dispatch:

# Una corrida nueva del mismo Pull Request cancela la anterior; las semanales y las manuales no se cancelan entre sí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baterias:
    # Windows: las pruebas de los hooks usan rutas de Windows (C:/...) y es donde se desarrolla el paquete.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Baterías de pruebas
        run: python tests/correr_todo.py
      - name: Sin claves ni datos personales en el repositorio
        run: python skills/senior/scripts/secretos.py todo
