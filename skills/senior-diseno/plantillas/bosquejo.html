<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{proyecto}} · Dirección {{letra}}</title>
{{visor_estilo}}
<style>
/* Esta plantilla no impone ningún estilo: el aspecto lo decide el diseñador.
   Reglas que sí valen (las controla scripts/revisar_diseno.py): una familia tipográfica ideal y dos como máximo
   en toda la web (más solo con <!-- excepcion-tipografia: motivo -->), etiqueta visible en cada campo, hasta 4 campos visibles y el resto en «opciones avanzadas»,
   una sola acción principal por pantalla, contraste suficiente, estados de hover y foco, prefers-reduced-motion.
   SIN DESBORDE HORIZONTAL: nada se sale del ancho de la pantalla ni a 390 px (mobile) ni a 1280 px (desktop). Lo mide scripts/desborde.py en un
   navegador y revisar_diseno.py lo marca FALLA. Para no caer en eso: columnas con minmax(0, 1fr) y min-width: 0 en lo que va dentro de un grid o un
   flex, anchos relativos y no fijos, y el código o las tablas anchas dentro de un contenedor con overflow-x: auto. */
/* Base estructural (no es estilo, no se toca): el ancho que se pide es el ancho que se usa. */
*, *::before, *::after { box-sizing: border-box; }
img, svg, video, canvas, iframe { max-width: 100%; }
body { overflow-wrap: anywhere; }
</style>
</head>
<body>
<!-- Una dirección = una estructura distinta. Marcar cada pantalla con data-pantalla="nombre" y cada parte
     intercambiable con data-bloque="nombre" (cabecera, navegación, principal, contenido, formulario, pie),
     con los mismos nombres en las tres direcciones para poder combinarlas.
     La carta de la dirección (idea, cliché que evita, riesgo que asume, comportamiento en mobile) va en un
     <aside class="nota"> que se ve con «Ver notas». -->
<div data-pantalla="inicio">

</div>
{{visor_script}}
</body>
</html>
