name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baterias:
    # Windows: las pruebas de los hooks usan rutas de Windows (C:/...) y es donde se desarrolla el paquete.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Baterías de pruebas
        run: python tests/correr_todo.py
