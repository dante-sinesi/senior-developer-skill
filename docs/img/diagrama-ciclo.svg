<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" font-family="ui-monospace, Consolas, 'Courier New', monospace"><title>Ciclo de trabajo de un cambio</title><desc>Ciclo de trabajo de un cambio: leer el estado, planear, abrir una rama, escribir el test que falla, el código mínimo y el refactor, actualizar la documentación, correr verificar.py y abrir el Pull Request; solo se fusiona si el usuario lo aprueba, y los hallazgos vuelven al código.</desc><rect width="760" height="536" fill="#0B2540"/><text x="30" y="36" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Ciclo de trabajo de un cambio</text><rect x="33" y="54" width="519" height="82" rx="6" fill="#5BC0EB" fill-opacity="0.07" stroke="#5BC0EB" stroke-opacity="0.55" stroke-dasharray="6 4"/><text x="43" y="73" font-size="13" font-weight="700" fill="#5BC0EB" text-anchor="start">Preparar</text><rect x="33" y="172" width="519" height="82" rx="6" fill="#5BC0EB" fill-opacity="0.07" stroke="#5BC0EB" stroke-opacity="0.55" stroke-dasharray="6 4"/><text x="43" y="191" font-size="13" font-weight="700" fill="#5BC0EB" text-anchor="start">Construir</text><rect x="33" y="302" width="344" height="82" rx="6" fill="#5BC0EB" fill-opacity="0.07" stroke="#5BC0EB" stroke-opacity="0.55" stroke-dasharray="6 4"/><text x="43" y="321" font-size="13" font-weight="700" fill="#5BC0EB" text-anchor="start">Verificar</text><rect x="383" y="290" width="344" height="224" rx="6" fill="#5BC0EB" fill-opacity="0.07" stroke="#5BC0EB" stroke-opacity="0.55" stroke-dasharray="6 4"/><text x="393" y="309" font-size="13" font-weight="700" fill="#5BC0EB" text-anchor="start">Revisar y fusionar</text><path d="M194 104 L216 104" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="216.0,104.0 207.0,99.0 207.0,109.0" fill="#5BC0EB"/><path d="M369 104 L391 104" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="391.0,104.0 382.0,99.0 382.0,109.0" fill="#5BC0EB"/><path d="M467.5 124 L467.5 202" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="467.5,202.0 462.5,193.0 472.5,193.0" fill="#5BC0EB"/><path d="M391 222 L369 222" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="369.0,222.0 378.0,217.0 378.0,227.0" fill="#5BC0EB"/><path d="M216 222 L194 222" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="194.0,222.0 203.0,217.0 203.0,227.0" fill="#5BC0EB"/><path d="M117.5 242 L117.5 332" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="117.5,332.0 112.5,323.0 122.5,323.0" fill="#5BC0EB"/><path d="M194 352 L216 352" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="216.0,352.0 207.0,347.0 207.0,357.0" fill="#5BC0EB"/><path d="M369 352 L391 352" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="391.0,352.0 382.0,347.0 382.0,357.0" fill="#5BC0EB"/><path d="M544 352 L566 352" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="566.0,352.0 557.0,347.0 557.0,357.0" fill="#5BC0EB"/><path d="M642.5 384 L642.5 462" fill="none" stroke="#5BC0EB" stroke-width="2"/><polygon points="642.5,462.0 637.5,453.0 647.5,453.0" fill="#5BC0EB"/><rect x="562.844" y="413" width="159.312" height="18" fill="#0B2540"/><text x="642.5" y="427" font-size="12" font-weight="400" fill="#C9E1F4" text-anchor="middle">sí, lo dice el usuario</text><path d="M642.5 320 L642.5 262 L292.5 262 L292.5 242" fill="none" stroke="#5BC0EB" stroke-width="2" stroke-dasharray="6 5"/><polygon points="292.5,242.0 287.5,251.0 297.5,251.0" fill="#5BC0EB"/><rect x="431.368" y="252" width="72.264" height="18" fill="#0B2540"/><text x="467.5" y="266" font-size="12" font-weight="400" fill="#C9E1F4" text-anchor="middle">hallazgos</text><rect x="41" y="84" width="153" height="40" rx="4" fill="#0B2540" stroke="#5BC0EB" stroke-width="2"/><text x="117.5" y="109" font-size="14" font-weight="400" fill="#C9E1F4" text-anchor="middle">Leer estado</text><rect x="216" y="84" width="153" height="40" rx="4" fill="#0B254